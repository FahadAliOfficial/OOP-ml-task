project:
  seed: 42

paths:
  train_data: data/processed/splits/train.csv
  validation_data: data/processed/splits/validation.csv
  test_data: data/processed/splits/test.csv
  artifact_dir: artifacts/ml
  model_path: artifacts/ml/tfidf_sentiment_pipeline.joblib
  metrics_path: artifacts/ml/ml_metrics.json

model:
  vectorizer:
    ngram_range:
      - [1, 1]
      - [1, 2]
    max_features:
      - 5000
      - 10000
    min_df:
      - 2
  classifier:
    type: logistic_regression
    C:
      - 0.1
      - 1.0
      - 3.0
    class_weight:
      - balanced
  grid_search:
    cv: 3
    scoring: f1_macro
    n_jobs: -1
